services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stb_reclamations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  nlp:
    build: ./nlp-service
    ports: ["8000:8000"]

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stb_reclamations
      NLP_URL: http://nlp:8000
    ports: ["8080:8080"]
    depends_on: [postgres, nlp]

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]

volumes:
  pgdata:
