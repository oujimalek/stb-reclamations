name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilation, tests et couverture
        run: mvn -B verify
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  nlp:
    name: Service NLP (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -v

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de production
        run: npx ng build --configuration production
